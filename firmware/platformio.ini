; PlatformIO project for the ESIR robot (Arduino MKR WiFi 1010 + Opla IoT Carrier)

[platformio]
default_envs = mkrwifi1010

[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino

; Serial Monitor speed, must match SERIAL_BAUD in include/config.h
monitor_speed = 115200

; Also find libraries that other libraries include (the carrier library pulls in many)
lib_ldf_mode = deep+

lib_deps =
    arduino-libraries/Arduino_MKRIoTCarrier
    arduino-libraries/WiFiNINA
    arduino-libraries/ArduinoHttpClient
    bblanchon/ArduinoJson @ ^7.0.0